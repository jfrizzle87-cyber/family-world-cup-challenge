<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family World Cup Challenge</title>
<style>
body{
    font-family:Arial,sans-serif;
    max-width:900px;
    margin:auto;
    padding:20px;
    background:#f5f5f5;
}
.card{
    border:1px solid #ccc;
    border-radius:10px;
    padding:12px;
    margin:10px 0;
    background:white;
}
table{
    width:100%;
    border-collapse:collapse;
}
th,td{
    border:1px solid #ddd;
    padding:8px;
    text-align:left;
}
button{
    padding:8px 12px;
    cursor:pointer;
}
h1{
    text-align:center;
}
</style>
</head>
<body>

<h1>🏆 Family World Cup Challenge</h1>

<div class="card">
<h2>Teams</h2>
<table>
<tr>
<th>Family Member</th>
<th>Teams</th>
<th>Points</th>
</tr>

<tr>
<td>Dad</td>
<td>Portugal, Argentina</td>
<td id="dad">0</td>
</tr>

<tr>
<td>Bryson</td>
<td>France, Portugal</td>
<td id="bryson">0</td>
</tr>

<tr>
<td>Bella</td>
<td>Portugal, Brazil</td>
<td id="bella">0</td>
</tr>

<tr>
<td>Mom</td>
<td>Spain, Brazil</td>
<td id="mom">0</td>
</tr>
</table>
</div>

<div class="card">
<h2>Enter Match Result</h2>

<select id="team">
<option>Portugal</option>
<option>Argentina</option>
<option>France</option>
<option>Brazil</option>
<option>Spain</option>
</select>

<select id="pts">
<option value="3">Win (3)</option>
<option value="1">Draw (1)</option>
<option value="0">Loss (0)</option>
<option value="2">Penalty Win (2)</option>
<option value="1">Penalty Loss (1)</option>
</select>

<button onclick="addPoints()">Add Result</button>
</div>

<div class="card">
<h2>Leaderboard</h2>
<ol id="leaderboard"></ol>
</div>

<script>

let scores = JSON.parse(
localStorage.getItem("fwc_scores") ||
'{"Dad":0,"Bryson":0,"Bella":0,"Mom":0}'
);

const owners = {
    Portugal:["Dad","Bryson","Bella"],
    Argentina:["Dad"],
    France:["Bryson"],
    Brazil:["Bella","Mom"],
    Spain:["Mom"]
};

function saveScores(){
    localStorage.setItem(
        "fwc_scores",
        JSON.stringify(scores)
    );
    renderLeaderboard();
}

function addPoints(){

    const team =
        document.getElementById("team").value;

    const points =
        parseInt(document.getElementById("pts").value);

    owners[team].forEach(person=>{
        scores[person]+=points;
    });

    saveScores();
}

function renderLeaderboard(){

    document.getElementById("dad").textContent =
        scores.Dad;

    document.getElementById("bryson").textContent =
        scores.Bryson;

    document.getElementById("bella").textContent =
        scores.Bella;

    document.getElementById("mom").textContent =
        scores.Mom;

    const leaderboard =
        document.getElementById("leaderboard");

    leaderboard.innerHTML = "";

    Object.entries(scores)
        .sort((a,b)=>b[1]-a[1])
        .forEach(entry=>{

            const li =
                document.createElement("li");

            li.textContent =
                `${entry[0]} - ${entry[1]} points`;

            leaderboard.appendChild(li);

        });
}

renderLeaderboard();

</script>

</body>
</html>
